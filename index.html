<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caldera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Shader background canvas — stays behind all UI via z-index -->
  <canvas id="shader-bg"></canvas>

  <!-- Custom title bar -->
  <div id="titlebar">
    <img id="app-icon" src="build/icon.png" alt="" />
    <span id="app-name">Caldera</span>
    <div id="win-controls">
      <button id="btn-settings" title="Settings">&#9881;</button>
      <button id="btn-min" title="Minimize">&#8211;</button>
      <button id="btn-max" title="Maximize">&#9633;</button>
      <button id="btn-close" title="Close">&#10005;</button>
    </div>
  </div>

  <!-- Month timeline strip -->
  <div id="month-strip">
    <div id="month-nav-area">
      <button id="prev-year" class="nav-arrow" title="Previous year">&#171;</button>
      <button id="prev-month" class="nav-arrow" title="Previous month">&#8249;</button>
      <span id="current-label"></span>
      <button id="next-month" class="nav-arrow" title="Next month">&#8250;</button>
      <button id="next-year" class="nav-arrow" title="Next year">&#187;</button>
    </div>
    <div id="month-tabs">
      <button class="month-tab" data-month="0">Jan</button>
      <button class="month-tab" data-month="1">Feb</button>
      <button class="month-tab" data-month="2">Mar</button>
      <button class="month-tab" data-month="3">Apr</button>
      <button class="month-tab" data-month="4">May</button>
      <button class="month-tab" data-month="5">Jun</button>
      <button class="month-tab" data-month="6">Jul</button>
      <button class="month-tab" data-month="7">Aug</button>
      <button class="month-tab" data-month="8">Sep</button>
      <button class="month-tab" data-month="9">Oct</button>
      <button class="month-tab" data-month="10">Nov</button>
      <button class="month-tab" data-month="11">Dec</button>
    </div>
    <div id="view-tabs">
      <button class="view-tab" id="btn-ai"   title="Event Import">&#10022;</button>
      <button class="view-tab active" data-view="calendar">Calendar</button>
      <button class="view-tab" data-view="schedule">Schedule</button>
    </div>
  </div>

  <!-- Calendar grid -->
  <div id="calendar-wrapper">
    <div id="calendar-header">
      <span>Sun</span><span>Mon</span><span>Tue</span>
      <span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
    </div>
    <div id="calendar-grid"></div>
  </div>

  <!-- Schedule view -->
  <div id="schedule-view" class="hidden">
    <div id="schedule-date-nav">
      <button id="sched-prev-day" class="nav-arrow" title="Previous day">&#8249;</button>
      <span id="sched-date-label"></span>
      <button id="sched-next-day" class="nav-arrow" title="Next day">&#8250;</button>
    </div>
    <div id="schedule-content">
      <div id="task-list"></div>
      <div id="schedule-main-column">
        <div id="schedule-mode-toolbar">
          <div id="schedule-mode-toggle">
            <button id="schedule-mode-daily" class="schedule-mode-btn active" type="button" data-mode="daily">Daily</button>
            <button id="schedule-mode-timeline" class="schedule-mode-btn" type="button" data-mode="schedule">Schedule</button>
          </div>
          <div id="schedule-scale-group" class="hidden">
            <span id="schedule-scale-label">Day View</span>
          </div>
        </div>
        <div id="reschedule-banner" class="hidden">
          Move &#8220;<span id="reschedule-label"></span>&#8221; to:
          <input id="reschedule-date-input" type="date" />
          <button id="reschedule-confirm">Move</button>
          <button id="reschedule-cancel">&#10005;</button>
        </div>
        <div id="daily-mode-panel">
          <div id="ampm-toggle">
            <button class="ampm-btn active" data-ampm="AM">AM</button>
            <button class="ampm-btn" data-ampm="PM">PM</button>
          </div>
          <div id="clock-area"></div>
          <div id="block-legend"></div>
        </div>
        <div id="timeline-mode-panel" class="hidden">
          <div id="timeline-empty" class="hidden">No scheduled blocks for this day yet.</div>
          <div id="timeline-surface">
            <div id="timeline-hour-header"></div>
            <div id="timeline-body-scroll">
              <div id="timeline-grid"></div>
              <div id="timeline-bars"></div>
            </div>
          </div>
        </div>
        <div id="schedule-block-panel">
          <div id="schedule-block-panel-empty">Select a time block to view the sub-tasks assigned to it.</div>
          <div id="schedule-block-panel-content" class="hidden">
            <div id="schedule-block-panel-header">
              <div id="schedule-block-panel-heading">
                <h3 id="schedule-block-panel-title"></h3>
                <div id="schedule-block-panel-meta"></div>
              </div>
              <button id="schedule-block-edit-btn" type="button">Edit Block</button>
            </div>
            <form id="schedule-subtask-form">
              <input id="schedule-subtask-input" type="text" placeholder="Add a sub-task for this block" autocomplete="off" />
              <button id="schedule-subtask-add" type="submit">Add Sub-task</button>
            </form>
            <div id="schedule-subtask-empty" class="hidden">No sub-tasks assigned yet.</div>
            <div id="schedule-subtask-list"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Block label popup -->
  <div id="block-label-popup" class="hidden">
    <div class="popup-row">
      <input id="block-label-input" type="text" placeholder="Label this block…" autocomplete="off" />
      <button id="block-label-confirm" title="Save block">&#10003;</button>
      <button id="block-label-del" title="Delete block">&#10005;</button>
    </div>
    <div class="popup-meta-row">
      <select id="block-ampm-select">
        <option value="AM">AM block</option>
        <option value="PM">PM block</option>
      </select>
      <select id="block-recurrence-select">
        <option value="none">No repeat</option>
        <option value="daily">Every day</option>
        <option value="weekly">Every week</option>
        <option value="monthly">Every month</option>
      </select>
    </div>
    <div id="block-scope-row" class="hidden">
      <label><input type="radio" name="block-scope" value="all" checked> All occurrences</label>
      <label><input type="radio" name="block-scope" value="today"> Just today</label>
    </div>
  </div>

  <!-- Day detail modal -->
  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <button id="modal-close">&#10005;</button>
      <div id="modal-header">
        <h2 id="modal-date"></h2>
        <div id="modal-header-actions">
          <button id="btn-schedule-day">&#9202; Schedule</button>
          <button id="btn-add-event">+ Add Event</button>
        </div>
      </div>
      <div id="event-cards"></div>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox-overlay" class="hidden">
    <button id="lightbox-close">&#10005;</button>
    <img id="lightbox-img" alt="" />
  </div>

  <!-- Settings modal -->
  <div id="settings-overlay" class="hidden">
    <div id="settings-modal">
      <button id="settings-modal-close">&#10005;</button>
      <h2 id="settings-modal-title">Settings</h2>

      <!-- Theme toggle -->
      <div id="theme-toggle-section" class="settings-section">
        <label class="settings-label">Theme</label>
        <div id="theme-toggle-row">
          <button class="theme-opt" data-theme="light">Light</button>
          <button class="theme-opt" data-theme="dark">Dark</button>
        </div>
      </div>

      <!-- Skin selection -->
      <div id="skin-section" class="settings-section">
        <label class="settings-label">Skin</label>
        <div id="skin-grid"></div>
      </div>

      <!-- Shader toggle (only visible for glass skins) -->
      <div id="shader-toggle-section" class="settings-section">
        <label class="settings-label">Animated Background</label>
        <div id="shader-toggle-row">
          <button class="shader-opt" data-pref="auto">Auto</button>
          <button class="shader-opt" data-pref="on">On</button>
          <button class="shader-opt" data-pref="off">Off</button>
        </div>
        <p id="shader-toggle-hint"></p>
      </div>
    </div>
  </div>

  <!-- AI Settings Modal -->
  <div id="ai-overlay" class="hidden">
    <div id="ai-modal">
      <button id="ai-modal-close">&#10005;</button>
      <h2 id="ai-modal-title">Event Import</h2>

      <div class="ai-field-group">
        <label class="ai-label">Provider</label>
        <div class="ai-radio-row">
          <label class="ai-radio-label">
            <input type="radio" name="ai-provider" value="claude" id="ai-provider-claude" />
            <span>Claude (Haiku)</span>
          </label>
          <label class="ai-radio-label">
            <input type="radio" name="ai-provider" value="openai" id="ai-provider-openai" />
            <span>OpenAI</span>
          </label>
          <label class="ai-radio-label">
            <input type="radio" name="ai-provider" value="ollama" id="ai-provider-ollama" />
            <span>Ollama (local)</span>
          </label>
        </div>
      </div>

      <div id="ai-apikey-panel" class="ai-panel">
        <div class="ai-field-group">
          <label class="ai-label" for="ai-apikey-input" id="ai-apikey-label">API Key</label>
          <input id="ai-apikey-input" type="password" class="ai-input"
                 placeholder="sk-..." autocomplete="off" spellcheck="false" />
        </div>
      </div>

      <div id="ai-ollama-panel" class="ai-panel hidden">
        <div class="ai-field-group">
          <label class="ai-label" for="ai-ollama-url">Ollama Endpoint</label>
          <input id="ai-ollama-url" type="url" class="ai-input"
                 placeholder="http://localhost:11434" autocomplete="off" />
        </div>
        <div class="ai-field-group">
          <label class="ai-label">Model</label>
          <div class="ai-model-row">
            <div class="ai-model-dropdown" id="ai-model-dropdown">
              <button type="button" class="ai-model-trigger" id="ai-model-trigger">
                <span class="ai-model-value" id="ai-model-value">Select a model...</span>
                <span class="ai-model-arrow">&#9662;</span>
              </button>
              <div class="ai-model-list hidden" id="ai-model-list"></div>
            </div>
            <input type="hidden" id="ai-ollama-model" value="" />
            <button id="ai-refresh-models" type="button" class="ai-btn-icon" title="Refresh models">&#8635;</button>
          </div>
        </div>
      </div>

      <div id="ai-mode-group" class="ai-field-group">
        <label class="ai-label">Import Mode</label>
        <div class="ai-radio-row">
          <label class="ai-radio-label">
            <input type="radio" name="ai-mode" value="fetch" id="ai-mode-fetch" />
            <span>Fetch my sites</span>
          </label>
          <label class="ai-radio-label">
            <input type="radio" name="ai-mode" value="websearch" id="ai-mode-websearch" />
            <span>Web Search</span>
          </label>
        </div>
      </div>

      <div id="ai-fetch-panel" class="ai-panel">
        <div class="ai-field-group">
          <label class="ai-label">Event Site URLs</label>
          <div id="ai-url-list"></div>
          <div class="ai-url-add-row">
            <input id="ai-url-input" type="url" class="ai-input"
                   placeholder="https://venue.com/events" autocomplete="off" />
            <button id="ai-url-add-btn" class="ai-btn-secondary">Add</button>
          </div>
        </div>
        <div class="ai-field-group">
          <label class="ai-label">Filter Keywords <span class="ai-label-hint">(optional)</span></label>
          <div id="ai-keyword-list"></div>
          <div class="ai-url-add-row">
            <input id="ai-keyword-input" type="text" class="ai-input"
                   placeholder="jazz, concert, meetup" autocomplete="off" />
            <button id="ai-keyword-add-btn" class="ai-btn-secondary">Add</button>
          </div>
        </div>
      </div>

      <div id="ai-websearch-panel" class="ai-panel hidden">
        <div class="ai-field-group">
          <label class="ai-label" for="ai-interests-input">Describe your interests</label>
          <textarea id="ai-interests-input" class="ai-textarea"
                    placeholder="jazz concerts, FC Barcelona matches, local tech meetups…"
                    rows="3"></textarea>
        </div>
      </div>

      <div class="ai-field-group">
        <label class="ai-label">Date Range <span class="ai-label-hint">(optional)</span></label>
        <div class="ai-date-range-row">
          <button type="button" id="ai-date-start-btn" class="ai-date-btn" data-target="ai-date-start">
            <span class="ai-date-btn-text">Start date</span>
            <svg class="ai-date-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18" />
            </svg>
          </button>
          <input id="ai-date-start" type="hidden" />
          <span class="ai-date-sep">to</span>
          <button type="button" id="ai-date-end-btn" class="ai-date-btn" data-target="ai-date-end">
            <span class="ai-date-btn-text">End date</span>
            <svg class="ai-date-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18" />
            </svg>
          </button>
          <input id="ai-date-end" type="hidden" />
        </div>
      </div>

      <div class="ai-modal-actions">
        <button id="ai-save-btn" class="ai-btn-primary">Save Settings</button>
        <button id="ai-run-btn" class="ai-btn-primary">Run Import</button>
      </div>

      <div id="ai-status" class="ai-status hidden"></div>
    </div>

    <!-- Custom Date Picker (outside modal for proper overlay) -->
    <div id="ai-datepicker" class="ai-datepicker hidden">
      <div class="ai-datepicker-header">
        <button type="button" id="ai-dp-prev" class="ai-dp-nav">&#9664;</button>
        <span id="ai-dp-month-year"></span>
        <button type="button" id="ai-dp-next" class="ai-dp-nav">&#9654;</button>
      </div>
      <div class="ai-datepicker-weekdays">
        <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
      </div>
      <div id="ai-dp-days" class="ai-datepicker-days"></div>
      <div class="ai-datepicker-footer">
        <button type="button" id="ai-dp-clear" class="ai-btn-secondary">Clear</button>
        <button type="button" id="ai-dp-today" class="ai-btn-secondary">Today</button>
      </div>
    </div>
  </div>

  <!-- AI Event Review Modal -->
  <div id="ai-review-overlay" class="hidden">
    <div id="ai-review-modal">
      <button id="ai-review-close">&#10005;</button>
      <h2 id="ai-review-title">Found Events</h2>
      <p id="ai-review-subtitle" class="ai-review-subtitle"></p>
      <div id="ai-event-list"></div>
      <div class="ai-review-actions">
        <button id="ai-select-all-btn"   class="ai-btn-secondary">Select All</button>
        <button id="ai-deselect-all-btn" class="ai-btn-secondary">Deselect All</button>
        <span class="ai-review-spacer"></span>
        <button id="ai-add-selected-btn" class="ai-btn-accent">Add to Calendar</button>
      </div>
    </div>
  </div>

  <script src="dist/renderer.js"></script>
</body>
</html>
