<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caldera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Shader background canvas — stays behind all UI via z-index -->
  <canvas id="shader-bg"></canvas>

  <!-- Custom title bar -->
  <div id="titlebar">
    <img id="app-icon" src="build/icon.png" alt="" />
    <span id="app-name">Caldera</span>
    <div id="win-controls">
      <button id="btn-theme" title="Toggle dark mode">&#9790;</button>
      <button id="btn-skin"  title="Change skin">&#9671;</button>
      <button id="btn-min" title="Minimize">&#8211;</button>
      <button id="btn-max" title="Maximize">&#9633;</button>
      <button id="btn-close" title="Close">&#10005;</button>
    </div>
  </div>

  <!-- Month timeline strip -->
  <div id="month-strip">
    <div id="month-nav-area">
      <button id="prev-year" class="nav-arrow" title="Previous year">&#171;</button>
      <button id="prev-month" class="nav-arrow" title="Previous month">&#8249;</button>
      <span id="current-label"></span>
      <button id="next-month" class="nav-arrow" title="Next month">&#8250;</button>
      <button id="next-year" class="nav-arrow" title="Next year">&#187;</button>
    </div>
    <div id="month-tabs">
      <button class="month-tab" data-month="0">Jan</button>
      <button class="month-tab" data-month="1">Feb</button>
      <button class="month-tab" data-month="2">Mar</button>
      <button class="month-tab" data-month="3">Apr</button>
      <button class="month-tab" data-month="4">May</button>
      <button class="month-tab" data-month="5">Jun</button>
      <button class="month-tab" data-month="6">Jul</button>
      <button class="month-tab" data-month="7">Aug</button>
      <button class="month-tab" data-month="8">Sep</button>
      <button class="month-tab" data-month="9">Oct</button>
      <button class="month-tab" data-month="10">Nov</button>
      <button class="month-tab" data-month="11">Dec</button>
    </div>
    <div id="view-tabs">
      <button class="view-tab" id="btn-ai"   title="AI Event Import">&#10022;</button>
      <button class="view-tab active" data-view="calendar">Calendar</button>
      <button class="view-tab" data-view="schedule">Schedule</button>
    </div>
  </div>

  <!-- Calendar grid -->
  <div id="calendar-wrapper">
    <div id="calendar-header">
      <span>Sun</span><span>Mon</span><span>Tue</span>
      <span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
    </div>
    <div id="calendar-grid"></div>
  </div>

  <!-- Schedule view -->
  <div id="schedule-view" class="hidden">
    <div id="schedule-date-nav">
      <button id="sched-prev-day" class="nav-arrow" title="Previous day">&#8249;</button>
      <span id="sched-date-label"></span>
      <button id="sched-next-day" class="nav-arrow" title="Next day">&#8250;</button>
    </div>
    <div id="schedule-content">
      <div id="task-list"></div>
      <div id="clock-column">
        <div id="reschedule-banner" class="hidden">
          Move &#8220;<span id="reschedule-label"></span>&#8221; to:
          <input id="reschedule-date-input" type="date" />
          <button id="reschedule-confirm">Move</button>
          <button id="reschedule-cancel">&#10005;</button>
        </div>
        <div id="ampm-toggle">
          <button class="ampm-btn active" data-ampm="AM">AM</button>
          <button class="ampm-btn" data-ampm="PM">PM</button>
        </div>
        <div id="clock-area"></div>
        <div id="block-legend"></div>
      </div>
    </div>
  </div>

  <!-- Block label popup -->
  <div id="block-label-popup" class="hidden">
    <div class="popup-row">
      <input id="block-label-input" type="text" placeholder="Label this block…" autocomplete="off" />
      <button id="block-label-confirm" title="Save block">&#10003;</button>
      <button id="block-label-del" title="Delete block">&#10005;</button>
    </div>
    <select id="block-recurrence-select">
      <option value="none">No repeat</option>
      <option value="daily">Every day</option>
      <option value="weekly">Every week</option>
      <option value="monthly">Every month</option>
    </select>
    <div id="block-scope-row" class="hidden">
      <label><input type="radio" name="block-scope" value="all" checked> All occurrences</label>
      <label><input type="radio" name="block-scope" value="today"> Just today</label>
    </div>
  </div>

  <!-- Day detail modal -->
  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <button id="modal-close">&#10005;</button>
      <div id="modal-header">
        <h2 id="modal-date"></h2>
        <div id="modal-header-actions">
          <button id="btn-schedule-day">&#9202; Schedule</button>
          <button id="btn-add-event">+ Add Event</button>
        </div>
      </div>
      <div id="event-cards"></div>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox-overlay" class="hidden">
    <button id="lightbox-close">&#10005;</button>
    <img id="lightbox-img" alt="" />
  </div>

  <!-- Skin picker modal -->
  <div id="skin-overlay" class="hidden">
    <div id="skin-modal">
      <button id="skin-modal-close">&#10005;</button>
      <h2 id="skin-modal-title">Appearance</h2>
      <div id="skin-grid"></div>
    </div>
  </div>

  <!-- AI Settings Modal -->
  <div id="ai-overlay" class="hidden">
    <div id="ai-modal">
      <button id="ai-modal-close">&#10005;</button>
      <h2 id="ai-modal-title">AI Event Import</h2>

      <div class="ai-field-group">
        <label class="ai-label">Provider</label>
        <div class="ai-radio-row">
          <label class="ai-radio-label">
            <input type="radio" name="ai-provider" value="claude" id="ai-provider-claude" />
            <span>Claude (Haiku)</span>
          </label>
          <label class="ai-radio-label">
            <input type="radio" name="ai-provider" value="ollama" id="ai-provider-ollama" />
            <span>Ollama (local)</span>
          </label>
        </div>
      </div>

      <div id="ai-claude-panel" class="ai-panel">
        <div class="ai-field-group">
          <label class="ai-label" for="ai-apikey-input">Anthropic API Key</label>
          <input id="ai-apikey-input" type="password" class="ai-input"
                 placeholder="sk-ant-api03-…" autocomplete="off" spellcheck="false" />
        </div>
      </div>

      <div id="ai-ollama-panel" class="ai-panel hidden">
        <div class="ai-field-group">
          <label class="ai-label" for="ai-ollama-url">Ollama Endpoint</label>
          <input id="ai-ollama-url" type="url" class="ai-input"
                 placeholder="http://localhost:11434" autocomplete="off" />
        </div>
        <div class="ai-field-group">
          <label class="ai-label" for="ai-ollama-model">Model</label>
          <input id="ai-ollama-model" type="text" class="ai-input"
                 placeholder="llama3.2" autocomplete="off" spellcheck="false" />
        </div>
      </div>

      <div id="ai-mode-group" class="ai-field-group">
        <label class="ai-label">Import Mode</label>
        <div class="ai-radio-row">
          <label class="ai-radio-label">
            <input type="radio" name="ai-mode" value="fetch" id="ai-mode-fetch" />
            <span>Fetch my sites</span>
          </label>
          <label class="ai-radio-label">
            <input type="radio" name="ai-mode" value="websearch" id="ai-mode-websearch" />
            <span>Web Search</span>
          </label>
        </div>
      </div>

      <div id="ai-fetch-panel" class="ai-panel">
        <div class="ai-field-group">
          <label class="ai-label">Event Site URLs</label>
          <div id="ai-url-list"></div>
          <div class="ai-url-add-row">
            <input id="ai-url-input" type="url" class="ai-input"
                   placeholder="https://venue.com/events" autocomplete="off" />
            <button id="ai-url-add-btn" class="ai-btn-secondary">Add</button>
          </div>
        </div>
      </div>

      <div id="ai-websearch-panel" class="ai-panel hidden">
        <div class="ai-field-group">
          <label class="ai-label" for="ai-interests-input">Describe your interests</label>
          <textarea id="ai-interests-input" class="ai-textarea"
                    placeholder="jazz concerts, FC Barcelona matches, local tech meetups…"
                    rows="3"></textarea>
        </div>
      </div>

      <div class="ai-modal-actions">
        <button id="ai-save-btn" class="ai-btn-primary">Save Settings</button>
        <button id="ai-run-btn"  class="ai-btn-accent">&#9889; Run Import</button>
      </div>

      <div id="ai-status" class="ai-status hidden"></div>
    </div>
  </div>

  <!-- AI Event Review Modal -->
  <div id="ai-review-overlay" class="hidden">
    <div id="ai-review-modal">
      <button id="ai-review-close">&#10005;</button>
      <h2 id="ai-review-title">Found Events</h2>
      <p id="ai-review-subtitle" class="ai-review-subtitle"></p>
      <div id="ai-event-list"></div>
      <div class="ai-review-actions">
        <button id="ai-select-all-btn"   class="ai-btn-secondary">Select All</button>
        <button id="ai-deselect-all-btn" class="ai-btn-secondary">Deselect All</button>
        <span class="ai-review-spacer"></span>
        <button id="ai-add-selected-btn" class="ai-btn-accent">Add to Calendar</button>
      </div>
    </div>
  </div>

  <script src="dist/renderer.js"></script>
</body>
</html>
